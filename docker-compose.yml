services:
  mysql:
    image: mysql:8
    container_name: docedondoca_database
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: doce_dondocas
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-api:
    image: luiseduardozordanmacagnan/back-doce-dondocas:1.0
    container_name: docedondoca_backend_container
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/doce_dondocas?useTimezone=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      - TOKEN_SECRET=${TOKEN_SECRET}

  frontend-app:
    image: luiseduardozordanmacagnan/front-doce-dondocas:1.0
    container_name: docedondoca_frontend_container
    ports:
      - "5173:5173"
    depends_on:
      - backend-api

volumes:
  mysql_data: